<!DOCTYPE html>
<head>
    <title>Polemia playground</title>
    <link rel="icon" href="https://www.polemia.com/wp-content/uploads/2020/05/cropped-favicon-1-32x32.png" sizes="32x32">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    <style>
        body {
            background-color: #eef;
            margin: 0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            background-color: #447cbf;
            color: #fff;
            border: none;
            outline:none;
            font-size: 20px;
            padding: 5px;
            flex: 1;
        }
        button:disabled {
            background-color: #85a2c5;
        }
        button:hover{
            cursor: pointer;
        }
        select{
            font-size: 20px;
            padding: 5px 10px;
            border: none;
            background-color: #fff;
            text-align: center;
        }
        select:focus{
            outline:none
        }
        #question-box {
            flex: 2;
            position: relative;
            min-width: 300px;
        }
        #question {
            box-sizing: border-box;
            border: 0;
            padding: 20px;
            font-size: 20px;
            outline: none;
            width: 100%;
        }
        #question-underline {
            background-color: #447cbf;
            height: 7px;
            width: 100%;
            position: absolute;
            left: 0;
            top: calc(100% - 6px);
        }
        #progress {
            background-color: #fdc62f;
            position: absolute;
            height: 7px;
            left: 0;
            top: calc(100% - 6px);
            width: 0;
        }
        #console {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #main-panel {
            display: flex;
            gap: 5px;
            flex-direction: row;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        #sources-panel {
            display: flex;
            gap: 5px 20px;
            flex-direction: row;
            justify-content: center;
            flex-wrap: wrap;
        }
        #sources-panel label {
            font-size: 20px;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        input[type=checkbox] {
            transform: scale(1.5);
            margin-right: 10px;
            accent-color: #447cbf;
        }
        #commands {
            display: flex;
            flex-direction: row;
            gap: 5px;
            flex: 1;
            justify-content: space-between;
        }
        #results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #answer {
            background-color: #447cbf;
            color: #fff;
            padding: 20px;
        }
        #hits {
            /* background-color: rgb(245, 245, 250); */
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .invisible {
            display: none;
            visibility: hidden;
        }
        .analyze {
            animation: progress 5s linear;
        }
        .sumup {
            animation: progress 4s linear;
        }
        .find {
            animation: progress 3s linear;
        }
        .hit {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .hit h1 {
            display: flex;
            flex-direction: row;
            font-weight: normal;
            gap: 10px;
            margin: 0;
            align-items: center;
        }
        .hit h1 p {
            margin: 0;
            font-size: 15px;
        }
        .source-origin {
            background-color: #fff;
            font-size: 15px;
            padding: 3px 8px;
            font-weight: bold;
        }
        @keyframes progress {
            from {
                width: 0%
            }
            to {
                width: 100%
            }
        }
    </style>
</head>
<body>
    <div id="console">
        <div id="main-panel">
            <img src="./LD5.png" alt="" height="60">
            <select name="ai-type" id="ai-selector">
                <option value="grok3-mini">grok3-mini</option>
                <option value="grok4">grok4</option>
                <option value="openai">openai</option>
                <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
            </select>
            <div id="question-box">
                <input type="text" id="question" placeholder="Votre question, mot-clé...">
                <span id="question-underline"></span>
                <span id="progress"></span>
            </div>
            <div id="commands">
                <button id="find">Trouver</button><button id="sumup">Résumer</button><button id="analyze">Analyser</button>
            </div>
        </div>
        <div id="sources-panel">
            <label><input type="checkbox" checked name="polemia">Polémia</input></label>
            <label><input type="checkbox" checked name="polemia-archives">Archives Polémia</input></label>
            <label><input type="checkbox" checked name="iliade">Iliade</input></label>
            <label><input type="checkbox" checked name="ojim">OJIM</input></label>
            <label><input type="checkbox" checked name="oid">OID</input></label>
            <label><input type="checkbox" checked name="vanguard">Marc Vanguard</input></label>
            <label><input type="checkbox" checked name="odj">ODJ</input></label>
        </div>
    </div>
    <div id="results">
        <div id="answer" class="invisible"></div>
        <div id="hits" class="invisible"></div>
    </div>
    <script>
        const input = document.getElementById('question');
        const find = document.getElementById('find');
        const sumup = document.getElementById('sumup');
        const analyze = document.getElementById('analyze');
        const answer = document.getElementById('answer');
        const hits = document.getElementById('hits');
        const progress = document.getElementById('progress');
        const sourcesInput = document.querySelectorAll('input[type=checkbox]');
        const aiSelector = document.getElementById('ai-selector')
        const sources = [];
        for(let sourceInput of sourcesInput) {
            sources.push(sourceInput.name)
            sourceInput.addEventListener('click', e => {
                const source = e.target.name;
                const index = sources.indexOf(source);
                index === -1 ? sources.push(source) : sources.splice(index,1);
                const buttons = document.getElementsByTagName('button')
                for (let button of buttons) {
                    button.disabled = sources.length === 0
                }
            })
        }
        analyze.addEventListener('click', async e=>{
            answer.classList.add('invisible')
            hits.classList.add('invisible')
            progress.classList.add('analyze')
            const response = await fetch('https://api.polem-ia.com/analyze', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources,
                    llm: aiSelector.value
                })
            })
            const json = await response.json();
            progress.classList.remove('analyze');
            answer.classList.remove('invisible')
            hits.classList.remove('invisible')
            answer.innerHTML = json.results.split('\n').join('<br>') 
            hits.innerHTML = json.resources.map(formalizeSource).join("")
        });
        find.addEventListener('click', async e=>{
            answer.classList.add('invisible')
            hits.classList.add('invisible')
            progress.classList.add('find')
            const response = await fetch('https://api.polem-ia.com/retrieve', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources,
                    llm: aiSelector.value
                })
            });
            const json = await response.json();
            hits.classList.remove('invisible');
            progress.classList.remove('find');
            answer.innerHTML = ""
            hits.innerHTML = json.resources.map(formalizeSource).join("")
        });
        sumup.addEventListener('click', async e=>{
            answer.classList.add('invisible')
            hits.classList.add('invisible')
            progress.classList.add('sumup')
            const response = await fetch('https://api.polem-ia.com/search', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources,
                    llm: aiSelector.value
                })
            })
            const json = await response.json();
            progress.classList.remove('sumup');
            answer.classList.remove('invisible');
            hits.innerHTML = ""
            answer.innerHTML = json.results
        });
        function getSource(url) {
            if(url.indexOf('ojim.fr') > -1) {
                return "OJIM"
            } else if(url.indexOf('archives.polemia.com') > -1) {// Put before polemia.com
                return "Archives Polémia"
            } else if(url.indexOf('polemia.com') > -1) {
                return "Polémia"
            } else if(url.indexOf('observatoire-justice.org') > -1) {
                return "ODJ"
            } else if(url.indexOf('observatoire-immigration.fr') > -1) {
                return "OID"
            } else if(url.indexOf('marc-vanguard.com') > -1) {
                return "Marc Vanguard"
            } else if(url.indexOf('institut-iliade.com') > -1) {
                return "Iliade"
            }
        }
        function formalizeSource(entry) {
            return `<div class="hit">
                <h1>
                    <span class="source-origin">${getSource(entry.url)}</span><p>${entry.title ?? ""}</p>
                </h1>
                <a href="${entry.url}">${entry.url}</a>
            </div>`
        }
    </script>
</body>
