<!DOCTYPE html>
<head>
    <title>Polemia playground</title>
    <link rel="icon" href="https://www.polemia.com/wp-content/uploads/2020/05/cropped-favicon-1-32x32.png" sizes="32x32">
    <style>
        body {
            background-color: #eef;
            margin: 0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
        button {
            background-color: #447cbf;
            color: #fff;
            border: none;
            outline:none;
            font-size: 20px;
            padding: 5px 20px;
        }
        button:disabled {
            background-color: #85a2c5;
        }
        button:hover{
            cursor: pointer;
        }
        input {
            border: 0;
            border-bottom: solid 5px #447cbf;
            padding: 20px;
            font-size: 20px;
            flex: 1;
            outline:none
        }
        #console {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #main-panel {
            display: flex;
            gap: 20px;
            flex-direction: row;
            justify-content: space-between;
        }
        #sources-panel {
            display: flex;
            gap: 20px;
            flex-direction: row;
            justify-content: space-evenly;
        }
        #sources-panel label {
            font-size: 20px;
            cursor: pointer;
        }
        input[type=checkbox] {
            transform: scale(1.5);
            margin-right: 10px;
        }
        #commands {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }
        #results div {
            border: solid 1px #aac;
            background-color: #dde;
            padding: 20px;
        }
        #progress-container {
            height: 20px;
            position: relative
        }
        #progress {
            background-color: #fdc62f;
            position: absolute;
            height: 100%;
            left:0;
            width: 0;
        }
        .analyze {
            animation: progress 6s linear;
        }
        .sumup {
            animation: progress 4s linear;
        }
        .find {
            animation: progress 3s linear;
        }
        @keyframes progress {
            from {
                width: 0%
            }
            to {
                width: 100%
            }
        }
    </style>
</head>
<body>
    <div id="console">
        <div id="main-panel">
            <img src="./LD5.png" alt="" height="70">
            <input type="text" id="question" placeholder="Votre question, mot-clé..."></input>
            <div id="commands">
                <button id="find">Trouver</button><button id="sumup">Résumer</button><button id="analyze">Analyzer</button>
            </div>
        </div>
        <div id="sources-panel">
            <label><input type="checkbox" checked name="polemia">Polémia</input></label>
            <label><input type="checkbox" checked name="polemia-archives">Archives Polémia</input></label>
            <label><input type="checkbox" checked name="iliade">Iliade</input></label>
            <label><input type="checkbox" checked name="ojim">OJIM</input></label>
            <label><input type="checkbox" checked name="oid">OID</input></label>
            <label><input type="checkbox" checked name="vanguard">Marc Vanguard</input></label>
            <label><input type="checkbox" checked name="odj">ODJ</input></label>
        </div>
    </div>
    <div id="progress-container">
        <span id="progress"></span>
    </div>
    <div id="results">
        <div id="overview"></div>
        <div id="analysis"></div>
        <div id="hits"></div>
    </div>
    <script>
        const input = document.getElementById('question');
        const find = document.getElementById('find');
        const sumup = document.getElementById('sumup');
        const analyze = document.getElementById('analyze');
        const overview = document.getElementById('overview');
        const analysis = document.getElementById('analysis');
        const hits = document.getElementById('hits');
        const progress = document.getElementById('progress');
        const sourcesInput = document.querySelectorAll('input[type=checkbox]');
        const sources = [];
        for(let sourceInput of sourcesInput){
            sources.push(sourceInput.name)
            sourceInput.addEventListener('click', e => {
                const source = e.target.name;
                const index = sources.indexOf(source);
                index === -1 ? sources.push(source) : sources.splice(index,1);
                const buttons = document.getElementsByTagName('button')
                for (let button of buttons) {
                    button.disabled = sources.length === 0
                }
            })
        }
        analyze.addEventListener('click', async e=>{
            progress.classList.add('analyze')
            const response = await fetch('https://api.polem-ia.com/analyze', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources
                })
            })
            const json = await response.json();
            progress.classList.remove('analyze')
            analysis.innerHTML = json.results.split('\n').join('<br>') 
            hits.innerHTML = json.resources.map(entry=>`<a href="${entry.url}">${entry.title === null ? entry.url : entry.title}</a>`).join('<br>')
        });
        find.addEventListener('click', async e=>{
            progress.classList.add('find')
            const response = await fetch('https://api.polem-ia.com/retrieve', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources
                })
            })
            const json = await response.json();
            progress.classList.remove('find')
            hits.innerHTML = json.resources.map(entry=>`<a href="${entry.url}">${entry.title === null ? entry.url : entry.title}</a>`).join('<br>')
        });
        sumup.addEventListener('click', async e=>{
            progress.classList.add('sumup')
            const response = await fetch('https://api.polem-ia.com/search', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    question: input.value,
                    sources
                })
            })
            const json = await response.json();
            progress.classList.remove('sumup')
            overview.innerHTML = json.results
        });
    </script>
</body>
